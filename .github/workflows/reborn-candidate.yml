name: Build Reborn recipe candidate (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/checks.py
      - run: python tools/verify_reborn.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AzerothStatsReborn-recipe-candidate
          path: |
            build/AzerothStatsReborn-*.zip
            build/AzerothStatsReborn-*.zip.sha256
            build/reborn-validation.json
          retention-days: 7
          if-no-files-found: error
